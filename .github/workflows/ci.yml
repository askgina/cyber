name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate curated inputs and test offline pipeline
        run: |
          python3 pipeline/check_curated.py
          python3 pipeline/test_curated.py
      - name: Generate fixtures from committed data
        run: |
          python3 pipeline/split_data.py
          python3 pipeline/prerender.py
      - run: npm run check
