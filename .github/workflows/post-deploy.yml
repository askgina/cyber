name: Post-deploy verification

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Use the trusted default-branch checkout for workflow_run, not a triggering
      # run's SHA or artifacts.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: npm
        run: npm ci
      - name: HTTP smoke
        run: npm run smoke:live -- --base-url https://cyber.askgina.ai
      - name: Install Playwright Chromium
        id: chromium
        if: ${{ !cancelled() && steps.npm.outcome == 'success' }}
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Browser verification
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run check:browser -- --base-url https://cyber.askgina.ai
